# GoReleaser config — cross-compiles agentsmith and publishes a GitHub Release
# on every pushed v* tag. See .github/workflows/release.yml.
version: 2

project_name: agentsmith

before:
  hooks:
    - go mod tidy

builds:
  - id: agentsmith
    main: .
    binary: agentsmith
    env:
      - CGO_ENABLED=0
    # Unix only: the hub lock uses flock(2) (see internal/lock). Windows needs a
    # LockFileEx-based implementation — tracked as a follow-up.
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    # Inject build metadata into the main package vars (see main.go).
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

archives:
  - id: default
    # agentsmith_0.1.0_linux_amd64.tar.gz — install.sh depends on this template.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
